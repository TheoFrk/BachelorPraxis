services:
  app:
    build: .
    image: securities-eye:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SE_DB: /app/var/securities-eye.sqlite
      SE_STATIC_DIR: /app/frontend/dist
    volumes:
      - securities-data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  securities-data:
